<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAS API v1 JSON Inspector</title>
  <link rel="stylesheet" href="https://jsdelivr.net">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="manifest" id="manifest-placeholder">
</head>
<body class="has-background-light" style="min-height: 100vh;">

  <nav class="navbar is-dark shadow-sm">
    <div class="container">
      <div class="navbar-brand">
        <a class="navbar-item" href="#">
          <i class="fas fa-code mr-2 text-info"></i><strong>MAS API v1 DevStudio</strong>
        </a>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      
      <!-- Interactive Parameter Controller Box -->
      <div class="box mb-5">
        <h2 class="title is-4 mb-4"><i class="fas fa-sliders-h text-grey mr-2"></i>Query Parameter Control</h2>
        
        <div class="columns is-desktop">
          <!-- Calendar Type Parameter Matrix -->
          <div class="column is-4">
            <div class="field">
              <label class="label">Target Instrument Calendar</label>
              <div class="control has-icons-left">
                <div class="select is-fullwidth">
                  <select id="param-type" onchange="inspectQueryData()">
                    <option value="bonds">SGS Government Bonds (Types: B, I, G)</option>
                    <option value="tbills-6m">6-Month Treasury Bills (Type: T)</option>
                    <option value="tbills-1y">1-Year Treasury Bills (Type: T)</option>
                    <option value="savings">Singapore Savings Bonds (Type: S)</option>
                  </select>
                </div>
                <div class="icon is-small is-left">
                  <i class="fas fa-file-invoice-dollar"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Date Filters -->
          <div class="column is-4">
            <div class="field">
              <label class="label">Start Issuance Date</label>
              <div class="control">
                <input class="input" type="date" id="param-start" value="2026-01-01" onchange="inspectQueryData()">
              </div>
            </div>
          </div>
          <div class="column is-4">
            <div class="field">
              <label class="label">End Issuance Date</label>
              <div class="control">
                <input class="input" type="date" id="param-end" value="2026-12-31" onchange="inspectQueryData()">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- JSON Viewer Shell -->
      <div class="box">
        <div class="is-flex is-justify-content-between is-align-items-center mb-3">
          <h3 class="title is-4 mb-0"><i class="fas fa-terminal text-grey mr-2"></i>Live JSON Response Payload</h3>
          <span class="tag is-info is-light id-hidden" id="loading-spinner">
            <i class="fas fa-spinner fa-pulse mr-1"></i> Running Proxy Fetch Task...
          </span>
        </div>
        
        <div class="field">
          <div class="control">
            <pre class="has-background-black has-text-success p-4" style="border-radius: 6px; max-height: 600px; overflow-y: auto;"><code id="json-display">Loading initial parameter matrix...</code></pre>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script>
    // Async execution handler connecting frontend inputs with serverless backend proxy
    async function inspectQueryData() {
      const display = document.getElementById('json-display');
      const spinner = document.getElementById('loading-spinner');
      
      const typeSelection = document.getElementById('param-type').value;
      const start = document.getElementById('param-start').value;
      const end = document.getElementById('param-end').value;

      let type = 'bonds';
      let tenor = '';

      if (typeSelection === 'tbills-6m') { type = 'tbills'; tenor = '0.5'; }
      if (typeSelection === 'tbills-1y') { type = 'tbills'; tenor = '1'; }
      if (typeSelection === 'savings') { type = 'savings'; }

      spinner.classList.remove('is-hidden');
      
      try {
        const queryUrl = `/api/bonds?type=${type}&start=${start}&end=${end}&tenor=${tenor}`;
        const response = await fetch(queryUrl);
        
        if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
        const data = await response.json();
        
        // Print formatted structural output inside the HTML pre container code space block
        display.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        display.textContent = JSON.stringify({
          success: false,
          error_context: "Failed fetching proxy network asset components.",
          details: err.message
        }, null, 2);
      } finally {
        spinner.classList.add('is-hidden');
      }
    }

    // Dynamic Standalone PWA Manifest Configuration Asset Mapping
    const manifest = {
      "short_name": "MASInspector",
      "name": "MAS API v1 Realtime Data Inspector Studio",
      "icons": [{ "src": "https://flaticon.com", "type": "image/png", "sizes": "512x512" }],
      "start_url": "/",
      "background_color": "#ffffff",
      "theme_color": "#363636",
      "display": "standalone"
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(manifestBlob));

    // Register PWA service worker referencing standalone physical script architecture 
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW setup skipped.', err));
      });
    }

    document.addEventListener('DOMContentLoaded', inspectQueryData);
  </script>
</body>
</html>
